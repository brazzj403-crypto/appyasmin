<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f0e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="App de musculação do casal. Registre séries, veja seu progresso e treinem juntos.">
<title>Casal Rats 🐀 — Treinem juntos</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23a8ff6b'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='36'%3E🐀%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0d0f0e;--panel:#161918;--panel2:#1e2220;--panel3:#252a27;
  --line:#2a302c;--text:#eef2ec;--muted:#7a8a78;--muted2:#536051;
  --green:#a8ff6b;--green2:#7be03a;--greenText:#0f2208;--greenDark:#1a3a0a;
  --accent:#ff6b9d;--accentSoft:#3a1020;
  --blue:#6bcfff;--blueSoft:#0a2535;
  --yellow:#ffd96b;--yellowSoft:#2a2008;
  --soft:#1e2c18;--danger:#ff6b6b;--dangerSoft:#2a0f0f;
  --shadow:0 24px 80px #00000080;--shadow-sm:0 4px 20px #00000040;
  --radius:22px;--radius-sm:12px;
  color-scheme:dark;
}
html[data-theme=light]{
  --bg:#f0f4ee;--panel:#ffffff;--panel2:#e8ede5;--panel3:#dde5d9;
  --line:#cdd7c8;--text:#1a241a;--muted:#5a6e58;--muted2:#8a9e88;
  --green:#5ab82a;--green2:#4a9e20;--greenText:#0f2208;--greenDark:#d4f4b8;
  --soft:#d8f0c5;--danger:#cc3333;--dangerSoft:#fde8e8;
  --shadow:0 24px 80px #1a3a0820;--shadow-sm:0 4px 20px #1a3a0810;
  color-scheme:light;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 'DM Sans',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:3px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:0}
button svg,span svg{pointer-events:none}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex:none;display:inline-block}
h1,h2,h3,p{margin:0}
h1,h2,h3,.brand-text{font-family:Manrope,sans-serif}
h1{font-size:32px;letter-spacing:-1.2px;font-weight:800;line-height:1.2}
h2{font-size:20px;letter-spacing:-.5px;font-weight:700}
h3{font-size:16px;font-weight:600}
small,.small{font-size:13px}
.muted{color:var(--muted)}
.muted2{color:var(--muted2)}
.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:grid;gap:16px}
.hidden{display:none!important}
.grow{flex:1;min-width:0}
.full{width:100%}

/* ─── LAYOUT ─────────────────────────── */
.shell{max-width:1520px;margin:auto}
.sidebar{
  position:fixed;top:0;bottom:0;width:220px;padding:36px 20px 28px;
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  z-index:10;background:var(--bg);
}
.main{margin-left:220px;padding:0 40px 60px;max-width:1300px}

/* ─── BRAND ─────────────────────────── */
.brand{display:flex;gap:10px;align-items:center}
.brand-mark{
  width:36px;height:36px;border-radius:12px;
  background:linear-gradient(135deg,var(--green),var(--green2));
  display:grid;place-items:center;font-size:20px;flex:none;
  box-shadow:0 0 20px var(--green)40;
}
.brand-text{font-size:22px;font-weight:900;letter-spacing:-1px;line-height:1}
.brand-text small{display:block;font-family:'DM Sans',sans-serif;color:var(--muted);font-size:10px;letter-spacing:2px;font-weight:500;margin-top:2px}

/* ─── NAV ─────────────────────────── */
.nav{display:grid;gap:5px;margin-top:50px}
.nav button{
  background:transparent;display:flex;align-items:center;gap:12px;
  text-align:left;border-radius:14px;padding:13px 16px;
  color:var(--muted);font-size:14px;font-weight:600;
  transition:all .15s;position:relative;
}
.nav button.active{background:var(--soft);color:var(--green)}
.nav button.active::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:60%;background:var(--green);border-radius:0 3px 3px 0;
}
.nav button:not(.active):hover{background:var(--panel2);color:var(--text)}
.sidebar-bottom{margin-top:auto}

/* ─── COUPLE BADGE in sidebar ────── */
.couple-badge{
  border-top:1px solid var(--line);padding:18px 8px 0;
  display:flex;gap:10px;align-items:center;
}
.rat-emoji{font-size:28px;line-height:1}
.couple-info strong{display:block;font-size:13px;font-weight:700;color:var(--text)}
.couple-info small{color:var(--muted);font-size:11px}

/* ─── PROFILE SWITCH BTN ─────────── */
.switch-profile-btn{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:10px 14px;border-radius:14px;border:1px solid var(--line);
  background:var(--panel2);font-size:13px;font-weight:700;
  color:var(--text);transition:all .15s;margin-top:10px;
  white-space:nowrap;overflow:hidden;
}
.switch-profile-btn:hover{border-color:var(--green)60;background:var(--soft);color:var(--green)}
.switch-profile-btn .sw-avatar{
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-size:10px;font-weight:800;flex:none;
  background:linear-gradient(135deg,var(--accent),#ff3d7a);color:#fff;
}
.switch-profile-btn.is-p1 .sw-avatar{
  background:linear-gradient(135deg,var(--green),var(--green2));color:var(--greenText);
}

/* ─── TOP BAR ─────────────────────── */
.topbar{height:100px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:12px}
.breadcrumb{font-size:13px;color:var(--muted)}
.breadcrumb b{color:var(--text)}
.mobile-brand{display:none}

/* ─── PROFILE PICKER ─────────────── */
.profile-wrap{display:flex;align-items:center;gap:10px}
.profile-picker{
  display:flex;gap:8px;align-items:center;
  border:1px solid var(--line);border-radius:100px;
  padding:4px 14px 4px 4px;background:var(--panel);
  transition:border-color .15s;
}
.profile-picker:hover{border-color:var(--green)40}
.avatar{
  height:36px;width:36px;border-radius:50%;display:grid;place-items:center;
  font-size:13px;font-weight:800;flex:none;
  background:linear-gradient(135deg,var(--green),var(--green2));color:var(--greenText);
  transition:transform .2s;
}
.avatar.partner{background:linear-gradient(135deg,var(--accent),#ff3d7a);color:#fff}
.avatar:hover{transform:scale(1.05)}
.profile-picker select{border:0;background:transparent;font-weight:600;font-size:13px;padding-right:4px;cursor:pointer}

/* ─── ICON BUTTON ─────────────────── */
.iconbtn{
  height:42px;min-width:42px;border-radius:50%;background:var(--panel);
  display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line);transition:all .15s;
}
.iconbtn:hover{background:var(--panel2);border-color:var(--green)50;transform:scale(1.05)}

/* ─── BUTTONS ─────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:14px;background:var(--panel2);
  font-weight:600;font-size:14px;min-height:46px;
  border:1px solid var(--line);transition:all .15s;white-space:nowrap;
}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active{transform:scale(.97)}
.btn.primary{
  background:linear-gradient(135deg,var(--green),var(--green2));
  color:var(--greenText);border:none;
  box-shadow:0 4px 20px var(--green)30;
}
.btn.primary:hover{box-shadow:0 8px 30px var(--green)50}
.btn.accent{background:linear-gradient(135deg,var(--accent),#ff3d7a);color:#fff;border:none}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--panel2)}
.btn.danger{color:var(--danger)}
.btn.outline{background:transparent;border-color:var(--line)}
.linkbtn{background:transparent;color:var(--muted);display:inline-flex;gap:6px;align-items:center;padding:6px 0;font-size:13px;transition:color .15s}
.linkbtn:hover{color:var(--text)}

/* ─── CARDS ─────────────────────────── */
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:24px;
  transition:border-color .2s;
}
.card:hover{border-color:var(--line)}

/* ─── CONTENT ─────────────────────── */
.content{padding-top:32px}
.heading{margin-bottom:28px}
.heading p{margin-top:8px;color:var(--muted);font-size:15px}
.date-line{color:var(--muted2);margin-bottom:8px;font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:700}

/* ─── BADGE ─────────────────────────── */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  border:1px solid var(--line);border-radius:100px;
  padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap;
}
.badge.green{background:var(--greenDark);color:var(--green);border:none}
.badge.accent{background:var(--accentSoft);color:var(--accent);border:none}
.badge.blue{background:var(--blueSoft);color:var(--blue);border:none}
.badge.yellow{background:var(--yellowSoft);color:var(--yellow);border:none}

/* ─── DASHBOARD ─────────────────────── */
.dashboard{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:22px}

/* ─── HERO CARD ─────────────────────── */
.hero{
  background:linear-gradient(135deg,#1a3a0a 0%,#0d1f06 100%);
  border:1px solid var(--green)30;
  padding:28px;border-radius:var(--radius);
  position:relative;overflow:hidden;min-height:280px;
  display:flex;flex-direction:column;justify-content:space-between;
}
.hero::before{
  content:'';position:absolute;top:-60px;right:-60px;
  width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,var(--green)15 0%,transparent 70%);
  pointer-events:none;
}
.hero-top{display:flex;align-items:center;justify-content:space-between}
.hero h2{font-size:34px;letter-spacing:-1.5px;line-height:1.15;color:#e8ffcc;margin:14px 0 10px}
.hero .eyebrow{color:var(--green)90;font-size:11px}
.hero-meta{display:flex;gap:20px;font-size:13px;color:#8ab87a;margin-bottom:22px}
.hero-meta span{display:flex;align-items:center;gap:6px}
.hero .btn.cta{
  background:var(--green);color:var(--greenText);border:none;
  padding:14px 22px;font-size:15px;border-radius:16px;
  box-shadow:0 4px 24px var(--green)40;
}
.hero .btn.cta:hover{box-shadow:0 8px 32px var(--green)60;transform:translateY(-2px)}

/* ─── EXERCISE LIST ─────────────────── */
.exercise-list{overflow:hidden;border-radius:18px;border:1px solid var(--line);background:var(--panel)}
.exercise-row{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line)}
.exercise-row:last-child{border-bottom:0}
.exercise-number{
  width:38px;height:38px;border-radius:11px;background:var(--panel2);
  color:var(--muted);display:grid;place-items:center;
  font-size:12px;font-weight:700;flex:none;
}
.exercise-row p{font-size:12px;color:var(--muted);margin-top:2px}
.exercise-row h3{font-family:'DM Sans';font-size:14px;letter-spacing:0;font-weight:600}
.exercise-rest{color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}

/* ─── WEEK ─────────────────────────── */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:18px}
.day{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  background:transparent;border-radius:12px;padding:10px 2px;
  color:var(--muted2);font-size:11px;font-weight:600;min-width:0;
  transition:background .15s;
}
.day .daynum{font-size:17px;color:var(--muted);font-weight:700}
.day.current{background:var(--green);color:var(--greenText)}
.day.current .daynum{color:var(--greenText);font-weight:900}
.day .daydot{width:4px;height:4px;border-radius:50%;background:var(--muted2)}
.day.current .daydot{background:var(--greenText)50}
.day .daydot.off{opacity:0}
.day.completed .daydot{background:var(--green);width:6px;height:6px;box-shadow:0 0 6px var(--green)}
.schedule-foot{border-top:1px solid var(--line);margin-top:14px;padding-top:14px;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}

/* ─── STATS ─────────────────────────── */
.stats-row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:22px 0 18px}
.stats-num{font-family:Manrope;font-size:40px;letter-spacing:-2px;font-weight:800;line-height:1}
.stats-num span{font-size:18px;color:var(--muted);font-weight:400;letter-spacing:0}
.ring{position:relative;height:84px;width:84px;flex:none}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring-value{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:800;font-family:Manrope}
.stat-foot{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);padding-top:16px;gap:14px}
.stat-foot>div+div{border-left:1px solid var(--line);padding-left:18px}
.stat-foot strong{display:block;font-size:20px;font-weight:700;font-family:Manrope}
.stat-foot small{color:var(--muted);font-size:11px}

/* ─── MINI NOTE ─────────────────────── */
.mini-note{padding:16px 18px;border:1px dashed var(--line);border-radius:16px;color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:start}
.mini-note .icon{width:16px;height:16px;margin-top:2px;flex:none}

/* ─── PLANS GRID ─────────────────────── */
.plans-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.plan-card{display:flex;flex-direction:column;min-height:270px;padding:22px}
.plan-letter{
  width:44px;height:44px;border:1px solid var(--line);border-radius:13px;
  display:grid;place-items:center;font:700 22px Manrope;
  background:var(--soft);color:var(--green);margin-bottom:18px;
}
.plan-card h2{margin-bottom:5px}
.plan-card .muted{font-size:13px}
.plan-card .plan-bottom{margin-top:auto;padding-top:20px}
.plan-actions{display:flex;gap:6px;margin-top:8px}
.plan-actions button{flex:1}

/* ─── TOOLBAR / SEGMENTED ─────────────── */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.segmented{display:inline-flex;gap:4px;background:var(--panel);padding:4px;border:1px solid var(--line);border-radius:14px}
.segmented button{border-radius:10px;min-height:36px;padding:6px 16px;font-size:13px;background:transparent;color:var(--muted);font-weight:600;transition:all .15s}
.segmented button.selected{background:var(--panel2);color:var(--text);box-shadow:0 2px 8px #0002}

/* ─── EMPTY ─────────────────────────── */
.empty{text-align:center;padding:50px 20px}
.empty .empty-icon{font-size:40px;margin-bottom:14px}
.empty h2{margin-bottom:8px}
.empty p{color:var(--muted);font-size:14px;max-width:320px;margin:0 auto 18px}

/* ─── HISTORY ─────────────────────────── */
.history-item{
  display:flex;align-items:center;gap:16px;width:100%;
  text-align:left;background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:18px 20px;margin-bottom:10px;
  transition:all .15s;
}
.history-item:hover{border-color:var(--green)40;transform:translateX(3px)}
.history-date{width:50px;text-align:center;flex:none;background:var(--panel2);border-radius:11px;padding:6px}
.history-date b{font-size:22px;display:block;font-weight:700;line-height:1.2;font-family:Manrope}
.history-date small{font-size:10px;text-transform:uppercase;color:var(--muted)}
.history-item p{font-size:12px;color:var(--muted);margin-top:2px}
.history-item h3{font-size:15px;font-weight:600}

/* ─── PROGRESS VIEW ─────────────────── */
.progress-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.chart-card{position:relative;min-height:200px}
.chart-wrap{position:relative;height:180px}
.pr-list{display:grid;gap:10px;margin-top:12px}
.pr-item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--panel2);border-radius:14px;border:1px solid var(--line)}
.pr-num{font-family:Manrope;font-size:22px;font-weight:800;color:var(--green);white-space:nowrap}
.pr-item small{color:var(--muted);font-size:12px;display:block;margin-top:2px}

/* ─── BODY WEIGHT ─────────────────── */
.weight-input-row{display:flex;gap:10px;align-items:end;margin-bottom:18px;flex-wrap:wrap}
.weight-input-row label{font-size:13px;color:var(--muted);font-weight:600}
.weight-input-row input{
  border:1px solid var(--line);background:var(--panel2);border-radius:11px;
  padding:10px 14px;color:var(--text);width:120px;font-size:16px;font-weight:700;
}
.weight-log{display:grid;gap:8px;max-height:280px;overflow-y:auto}
.weight-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--panel2);border-radius:11px;font-size:14px}
.weight-row strong{font-family:Manrope;font-size:17px;font-weight:700}
.weight-delta{font-size:12px;font-weight:700}
.weight-delta.up{color:var(--accent)}
.weight-delta.down{color:var(--green)}

/* ─── SETTINGS ─────────────────────── */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.field{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea,input.control,select.control{
  border:1px solid var(--line);background:var(--panel2);border-radius:11px;
  padding:11px 14px;color:var(--text);width:100%;min-width:0;font-size:15px;
  transition:border-color .15s;
}
.field input:hover,.field select:hover{border-color:var(--green)50}
.field textarea{resize:vertical;min-height:72px}
.setting-row{padding:16px 0;border-bottom:1px solid var(--line)}
.setting-row:last-child{border-bottom:0;padding-bottom:0}
.setting-row p{color:var(--muted);font-size:13px;margin-top:4px}
.setting-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.theme-choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.theme-choice{
  padding:14px 8px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel2);font-size:13px;font-weight:600;
  display:grid;justify-items:center;gap:7px;transition:all .15s;
}
.theme-choice:hover{border-color:var(--green)50}
.theme-choice.selected{border-color:var(--green);background:var(--soft);color:var(--green)}

/* ─── NOTIFICATION SECTION ──────────── */
.notif-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.notif-row:last-child{border-bottom:0}
.toggle{
  width:48px;height:26px;border-radius:13px;background:var(--panel3);
  border:1px solid var(--line);position:relative;cursor:pointer;
  transition:background .2s;flex:none;
}
.toggle.on{background:var(--green);border-color:var(--green)}
.toggle::after{
  content:'';position:absolute;top:3px;left:3px;
  width:18px;height:18px;border-radius:50%;background:#fff;
  transition:transform .2s;box-shadow:0 1px 4px #0003;
}
.toggle.on::after{transform:translateX(22px)}

/* ─── SESSION ─────────────────────── */
.session-shell{max-width:760px;margin:auto}
.session-info{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}
.progress-track{height:6px;border-radius:10px;background:var(--line);overflow:hidden;margin-top:12px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--green2));border-radius:10px;transition:width .3s}
.session-exercise{margin:16px 0;padding:22px}
.session-exercise .exercise-top{display:flex;gap:12px;align-items:start;margin-bottom:18px}
.session-exercise .exercise-top p{font-size:12px;color:var(--muted);margin-top:2px}
.set-header,.set-row{display:grid;grid-template-columns:36px minmax(0,1fr) minmax(0,1fr) 44px;gap:10px;align-items:center}
.set-header{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted2);margin-bottom:8px;text-align:center;font-weight:700}
.set-row{margin-top:6px}
.set-index{text-align:center;color:var(--muted);font-size:13px;font-weight:700}
.set-row input{
  width:100%;min-width:0;background:var(--panel2);border:1px solid var(--line);
  color:var(--text);border-radius:11px;text-align:center;
  padding:10px 4px;font-size:16px;font-weight:700;height:46px;
  transition:border-color .15s;
}
.set-row input:hover{border-color:var(--green)50}
.set-row.done input{border-color:var(--green)60;background:var(--soft)}
.set-check{
  height:46px;width:44px;border-radius:11px;
  border:1px solid var(--line);background:var(--panel2);
  color:var(--muted);transition:all .15s;
}
.set-row.done .set-check{background:var(--green);color:var(--greenText);border-color:var(--green);box-shadow:0 2px 10px var(--green)40}
.set-row.done .set-check:hover{filter:brightness(1.1)}
.notes-input{
  width:100%;margin-top:14px;background:transparent;color:var(--muted);
  border:0;border-bottom:1px solid var(--line);padding:8px 0;font-size:13px;
}
.notes-input:focus{border-color:var(--green)60}
.session-label{font-size:13px;display:flex;align-items:center;gap:6px;color:var(--green);font-weight:600}
.session-bottom{display:flex;gap:10px;margin:22px 0 80px}
.session-bottom>.btn{flex:1}

/* ─── REST BAR ─────────────────────── */
.restbar{
  position:fixed;bottom:28px;left:calc(50% + 110px);transform:translateX(-50%);
  z-index:30;border-radius:20px;
  background:linear-gradient(135deg,var(--green),var(--green2));
  color:var(--greenText);padding:14px 18px;
  box-shadow:0 8px 40px var(--green)50;
  display:flex;align-items:center;gap:16px;
  width:max-content;max-width:calc(100% - 260px);
  animation:slideUp .25s ease-out;
}
@keyframes slideUp{from{transform:translateX(-50%) translateY(20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
.restbar strong{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px;font-family:Manrope}
.restbar small{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.restbar button{height:36px;min-width:36px;border-radius:10px;background:#1a3a0a50;font-size:13px;padding:6px 8px;font-weight:700;color:var(--greenText)}
.restbar button .icon{width:16px;height:16px}

/* ─── TOAST ─────────────────────────── */
.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  padding:12px 20px;border:1px solid var(--line);border-radius:14px;
  z-index:1000;box-shadow:var(--shadow);
  background:var(--panel);color:var(--text);
  font-size:13px;font-weight:600;max-width:90%;width:max-content;
  transition:opacity .2s;backdrop-filter:blur(12px);
}
.toast:empty{display:none}

/* ─── MODAL ─────────────────────────── */
dialog{
  background:var(--panel);color:var(--text);border:1px solid var(--line);
  border-radius:26px;padding:0;width:600px;
  max-width:calc(100vw - 24px);max-height:90dvh;
  box-shadow:var(--shadow);
}
dialog::backdrop{background:#04080490;backdrop-filter:blur(8px)}
.modal-head{padding:22px 24px 16px;display:flex;justify-content:space-between;align-items:center;gap:14px;border-bottom:1px solid var(--line)}
.modal-body{padding:22px 24px;overflow-y:auto;max-height:60vh}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--panel);z-index:2}

/* ─── PLAN EDITOR ─────────────────── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.edit-exercise{border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px;background:var(--panel2)}
.exercise-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:10px}
.edit-exercise .field input{padding:9px;font-size:14px}
.edit-tools{display:flex;gap:5px}
.edit-tools .iconbtn{height:32px;min-width:32px;background:var(--bg);border-radius:9px}
.edit-tools .icon{width:14px;height:14px}
.edit-day{display:flex;gap:5px;margin:10px 0 18px;flex-wrap:wrap}
.edit-day label{display:block}
.edit-day input{position:absolute;opacity:0;width:1px;height:1px}
.edit-day span{display:block;padding:8px 11px;border:1px solid var(--line);border-radius:10px;font-size:13px;cursor:pointer;font-weight:600;transition:all .15s}
.edit-day input:checked+span{background:var(--green);color:var(--greenText);border-color:var(--green)}
.edit-day input:focus-visible+span{outline:2px solid var(--green);outline-offset:3px}

/* ─── SUMMARY MODAL ─────────────────── */
.summary-value{font:800 38px Manrope;letter-spacing:-1.5px;margin-top:8px;color:var(--green)}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:20px 0}
.summary-grid>div{border:1px solid var(--line);border-radius:16px;padding:16px}
.history-ex{padding:16px 0;border-top:1px solid var(--line)}
.history-ex p{color:var(--muted);font-size:13px;margin-top:5px}
.confetti-bar{text-align:center;font-size:32px;letter-spacing:8px;margin-bottom:16px}

/* ─── SECTION TITLE ─────────────────── */
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 12px}
.section-title h2{font-size:18px}

/* ─── INLINE ERROR ─────────────────── */
.inline-error{color:var(--danger);font-size:13px;margin-top:10px;font-weight:600}

/* ─── CHANGE PLAN ─────────────────── */
.change-plan{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:14px}
.change-plan select{max-width:220px;border:0;background:transparent;color:var(--text);font-size:13px;font-weight:600}

/* ─── ANIMATIONS ─────────────────────── */
.fade-in{animation:arrive .2s ease-out}
@keyframes arrive{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* ─── FOOTER ─────────────────────────── */
.app-footer{color:var(--muted2);font-size:11px;text-align:center;margin-top:28px;letter-spacing:1px}

/* ─── RESPONSIVE ─────────────────────── */
@media(min-width:1520px){.sidebar{margin-left:0}}
@media(max-width:1100px){
  .sidebar{width:180px;padding:28px 16px}
  .main{margin-left:180px;padding:0 24px 40px}
  .dashboard{gap:16px;grid-template-columns:minmax(0,1.3fr) minmax(250px,1fr)}
  .hero{padding:22px}.hero h2{font-size:28px}
  .plans-grid{grid-template-columns:1fr 1fr}
  .progress-grid{grid-template-columns:1fr}
  .restbar{left:calc(50% + 90px)}
}
@media(max-width:820px){
  .sidebar{width:76px;align-items:center;padding:28px 10px}
  .brand .brand-text,.sidebar .nav span,.sidebar-bottom{display:none}
  .nav{width:100%;margin-top:40px}
  .nav button{padding:14px;justify-content:center}
  .main{margin-left:76px;padding:0 20px 40px}
  .dashboard{grid-template-columns:1fr}
  .right-stack{display:grid;grid-template-columns:1fr 1fr;align-items:start;gap:16px}
  .right-stack .mini-note{grid-column:1/-1}
  .settings-grid{grid-template-columns:1fr}
  .restbar{left:calc(50% + 38px);max-width:calc(100% - 110px)}
}
@media(max-width:600px){
  .sidebar{position:fixed;top:auto;bottom:0;left:0;right:0;width:100%;height:auto;padding:6px 12px calc(7px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);background:var(--bg);z-index:40}
  .sidebar>.brand{display:none}
  .nav{margin:0;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
  .nav button{display:flex;flex-direction:column;gap:3px;border-radius:10px;padding:8px 2px 4px;font-size:10px;font-weight:600;background:transparent!important}
  .nav button span{display:block!important}
  .nav button::before{display:none}
  .nav .icon{width:22px;height:22px}
  .main{margin:0;padding:0 16px calc(90px + env(safe-area-inset-bottom))}
  .topbar{height:80px;border-bottom:0;gap:6px;padding-top:env(safe-area-inset-top)}
  .breadcrumb{display:none}
  .mobile-brand{display:flex;font-size:18px;gap:7px;letter-spacing:-0.5px;align-items:center;font-family:Manrope;font-weight:900}
  .mobile-brand .brand-mark{width:28px;height:28px;font-size:16px;border-radius:9px}
  .profile-picker{padding:3px 8px 3px 3px;gap:4px}
  .profile-picker select{max-width:90px;font-size:12px}
  .avatar{height:30px;width:30px;font-size:11px}
  .topbar .iconbtn{height:36px;min-width:36px;background:transparent;border:none}
  .content{padding-top:10px}
  .heading{margin-bottom:20px}
  .heading h1{font-size:26px}
  .dashboard{gap:18px}
  .hero{padding:20px;min-height:260px}
  .hero h2{font-size:28px;margin-top:12px}
  .right-stack{display:grid;grid-template-columns:1fr;gap:16px}
  .card{padding:18px}
  .week{gap:5px}
  .section-title h2{font-size:17px}
  .plans-grid{grid-template-columns:1fr}
  .progress-grid{grid-template-columns:1fr}
  .settings-grid{gap:16px}
  .restbar{bottom:calc(78px + env(safe-area-inset-bottom));left:12px;right:12px;transform:none;max-width:none;width:auto;gap:10px;padding:12px 14px;justify-content:space-between}
  .restbar strong{font-size:24px}
  .restbar .rest-icon{display:none}
  .toast{bottom:calc(90px + env(safe-area-inset-bottom));font-size:12px}
  .session-exercise{padding:16px 14px}
  .set-header,.set-row{grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 40px;gap:7px}
  .set-check{width:40px}
  .session-bottom{margin-bottom:90px;flex-direction:column}
  .modal-head{padding:16px}
  .modal-body{padding:16px;max-height:55vh}
  .modal-foot{padding:14px 16px}
  dialog{max-width:calc(100vw - 16px);max-height:93dvh;border-radius:20px}
  .form-grid{gap:10px}
  .exercise-fields{gap:7px}
  .history-item{padding:14px 12px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <span class="brand-mark">🐀</span>
    <span class="brand-text">Rats<small>casal ♥</small></span>
  </div>
  <nav class="nav" aria-label="Navegação" id="navigation"></nav>
  <div class="sidebar-bottom">
    <div class="couple-badge">
      <span class="rat-emoji">🐀</span>
      <div class="couple-info">
        <strong>Casal Rats</strong>
        <small>boraaaa meu amo</small>
      </div>
    </div>
  </div>
</aside>
<main class="main">
  <header class="topbar">
    <div class="breadcrumb">Casal Rats &nbsp;/&nbsp; <b id="page-label">Hoje</b></div>
    <div class="brand mobile-brand"><span class="brand-mark">🐀</span>Rats</div>
    <div class="profile-wrap">
      <button class="iconbtn" id="theme-toggle" aria-label="Alternar tema"></button>
      <div class="profile-picker">
        <span class="avatar" id="avatar">JP</span>
        <span id="active-name" style="font-size:13px;font-weight:700"></span>
        <button id="switch-profile-btn" class="switch-profile-btn" aria-label="Trocar perfil" style="padding:6px 12px;margin:0;border-radius:100px;font-size:12px"></button>

</main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="modal" aria-labelledby="modal-title"></dialog>

<script>
'use strict';

// ── ICONS ───────────────────────────────────────────────────────
const paths={
  home:'M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z',
  dumbbell:'m6.5 6.5 11 11M4 9 9 4M15 20l5-5M2 7l5-5M17 22l5-5M5 11l6-6M13 19l6-6',
  history:'M3 11a9 9 0 1 1 2.3 7M3 4v7h7M12 7v5l3 2',
  settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M9 3l-1 3-3 1-2 3 2 2-1 3 2 3 3-1 2 4h3l1-3 3-1 2-3-2-2 1-3-2-3-3 1-2-4Z',
  sun:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1 1M18 18l1 1M5 19l1-1M18 6l1-1',
  moon:'M20.5 13A8.5 8.5 0 0 1 11 3.5 8.5 8.5 0 1 0 20.5 13Z',
  arrow:'M4 12h16m-6-6 6 6-6 6',
  chevron:'m9 5 7 7-7 7',
  down:'m6 9 6 6 6-6',up:'m6 15 6-6 6 6',
  clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M12 7v5l3 2',
  check:'m5 12 4 4L19 6',
  plus:'M12 5v14M5 12h14',
  close:'m6 6 12 12M6 18 18 6',
  edit:'m15 4 5 5M4 20l5-1L21 7l-5-5L4 14Z',
  copy:'M8 8h12v13H8ZM4 16H2V2h13v3',
  trash:'M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7',
  calendar:'M3 5h18v16H3ZM7 2v6M17 2v6M3 10h18',
  info:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M12 11v6M12 7h.01',
  pause:'M9 5v14M15 5v14',
  play:'m8 4 12 8-12 8Z',
  back:'M20 12H4m6-6-6 6 6 6',
  download:'M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5',
  trophy:'M7 3h10v6a5 5 0 0 1-10 0ZM7 5H3v3a4 4 0 0 0 4 4M17 5h4v3a4 4 0 0 1-4 4M12 14v7M8 21h8',
  share:'M12 15V2m-4 4 4-4 4 4M7 9H4v12h16V9h-3',
  trend:'M3 17l6-8 4 5 4-6 5 9',
  weight:'M12 3a3 3 0 1 0 0 6 3 3 0 0 0 0-6M5 22h14M8 22V9a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v13',
  bell:'M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0',
  chart:'M18 20V10M12 20V4M6 20v-6',
  star:'M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2Z',
};
function icon(name,cls=''){return `<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.dumbbell}"/></svg>`}

// ── UTILS ────────────────────────────────────────────────────────
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const clone=v=>JSON.parse(JSON.stringify(v));
const KEY='rats-app-v2';
const dayNames=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

// ── EXERCISEDB OSS API ───────────────────────────────────────────
const EXDB_BASE='https://oss.exercisedb.dev/api/v1';
const EXDB_CACHE_KEY='rats-exdb-cache';
const EXDB_CACHE_TTL=48*60*60*1000; // 48h
let exdbCache=null;

function loadExdbCache(){
  try{
    const raw=localStorage.getItem(EXDB_CACHE_KEY);
    if(!raw)return null;
    const c=JSON.parse(raw);
    if(Date.now()-c.ts>EXDB_CACHE_TTL){localStorage.removeItem(EXDB_CACHE_KEY);return null}
    return c.data;
  }catch{return null}
}
function saveExdbCache(data){
  try{localStorage.setItem(EXDB_CACHE_KEY,JSON.stringify({ts:Date.now(),data}))}catch{}
}

async function searchExercises(query){
  if(!query||query.length<2)return [];
  const q=query.toLowerCase().trim();
  // try local cache first
  if(!exdbCache)exdbCache=loadExdbCache();
  if(exdbCache){
    return exdbCache.filter(e=>e.name.toLowerCase().includes(q)||(e.targetMuscles||[]).some(m=>m.toLowerCase().includes(q))).slice(0,12);
  }
  // fetch from API
  try{
    const url=`${EXDB_BASE}/exercises?limit=1500`;
    const res=await fetch(url,{signal:AbortSignal.timeout(8000)});
    if(!res.ok)throw new Error('API error');
    const json=await res.json();
    const data=(json.data||json||[]).map(e=>({exerciseId:e.exerciseId,name:e.name,gifUrl:e.gifUrl,bodyParts:e.bodyParts,targetMuscles:e.targetMuscles,equipments:e.equipments}));
    exdbCache=data;
    saveExdbCache(data);
    return data.filter(e=>e.name.toLowerCase().includes(q)||(e.targetMuscles||[]).some(m=>m.toLowerCase().includes(q))).slice(0,12);
  }catch{
    return [];
  }
}

function ptMuscle(m){
  const map={chest:'Peito',back:'Costas',shoulders:'Ombros',biceps:'Bíceps',triceps:'Tríceps',forearms:'Antebraços',abs:'Abdômen',quads:'Quadríceps',hamstrings:'Isquiotibiais',glutes:'Glúteos',calves:'Panturrilha',spine:'Coluna',lats:'Dorsais','upper back':'Trapézio',traps:'Trapézio',core:'Core',neck:'Pescoço',adductors:'Adutores',abductors:'Abdutores',pectorals:'Peitorais',deltoids:'Deltoides','hip flexors':'Flexores de quadril'};
  return map[m?.toLowerCase()]||m||'';
}
function ptBodyPart(p){
  const map={chest:'Peito',back:'Costas',shoulders:'Ombros','upper arms':'Braços','lower arms':'Antebraços',waist:'Cintura','upper legs':'Coxas','lower legs':'Pernas',cardio:'Cardio',neck:'Pescoço'};
  return map[p?.toLowerCase()]||p||'';
}

let exSearchTimer=null;
let activeExInput=null;
let currentDropdown=null;

function closeExDropdown(){
  if(currentDropdown){currentDropdown.remove();currentDropdown=null}
}

function bindExSearch(input){
  if(input.dataset.exBound)return;
  input.dataset.exBound='1';
  input.addEventListener('input',async function(){
    clearTimeout(exSearchTimer);
    activeExInput=this;
    const spin=this.parentElement.querySelector('.ex-search-spin');
    if(spin)spin.classList.add('show');
    closeExDropdown();
    const q=this.value.trim();
    if(q.length<2){if(spin)spin.classList.remove('show');return}
    exSearchTimer=setTimeout(async()=>{
      const results=await searchExercises(q);
      if(spin)spin.classList.remove('show');
      if(document.activeElement!==input&&activeExInput!==input)return;
      closeExDropdown();
      if(!results.length)return;
      const dd=document.createElement('div');
      dd.className='ex-dropdown';
      dd.setAttribute('role','listbox');
      results.forEach(ex=>{
        const opt=document.createElement('div');
        opt.className='ex-option';
        opt.setAttribute('role','option');
        opt.setAttribute('tabindex','0');
        const muscle=ptMuscle((ex.targetMuscles||[])[0])||ptBodyPart((ex.bodyParts||[])[0])||'';
        opt.innerHTML=`<img class="ex-gif" src="${ex.gifUrl}" alt="${ex.name}" loading="lazy"><div class="ex-info"><strong>${ex.name}</strong><small>${ptBodyPart((ex.bodyParts||[])[0])||''}</small></div>${muscle?`<span class="ex-badge">${muscle}</span>`:''}` ;
        opt.addEventListener('mousedown',e=>e.preventDefault());
        opt.addEventListener('click',()=>{
          input.value=ex.name.charAt(0).toUpperCase()+ex.name.slice(1);
          input.dispatchEvent(new Event('input',{bubbles:true}));
          closeExDropdown();
        });
        opt.addEventListener('keydown',e=>{if(e.key==='Enter'){input.value=ex.name.charAt(0).toUpperCase()+ex.name.slice(1);closeExDropdown();}});
        dd.appendChild(opt);
      });
      const wrap=input.closest('.ex-search-wrap')||input.parentElement;
      wrap.style.position='relative';
      wrap.appendChild(dd);
      currentDropdown=dd;
    },350);
  });
  input.addEventListener('blur',()=>setTimeout(closeExDropdown,200));
  input.addEventListener('keydown',e=>{
    if(!currentDropdown)return;
    const opts=[...currentDropdown.querySelectorAll('.ex-option')];
    const cur=currentDropdown.querySelector('.ex-option:focus');
    const idx=opts.indexOf(cur);
    if(e.key==='ArrowDown'){e.preventDefault();(opts[idx+1]||opts[0])?.focus()}
    if(e.key==='ArrowUp'){e.preventDefault();(opts[idx-1]||opts[opts.length-1])?.focus()}
    if(e.key==='Escape')closeExDropdown();
  });
}

function bindAllExSearches(){
  document.querySelectorAll('[data-edit-field="name"]').forEach(input=>bindExSearch(input));
}

// ── DEFAULT DATA ─────────────────────────────────────────────────
function exercise(name,sets=3,reps='10–12',rest=60,notes=''){return{id:uid(),name,sets,reps,rest,notes}}

function initial(){return{
  version:2,
  profiles:[{id:'p1',name:'João Pedro'},{id:'p2',name:'Yasmin'}],
  active:'p1',theme:'dark',
  plans:[...defaultPlansJoao('p1'),...defaultPlansYasmin('p2')],
  sessions:[],ongoing:{},rest:null,
  weights:{p1:[],p2:[]},
  notifications:{reminder:false,reminderTime:'07:00'},
}}

// ── STATE ────────────────────────────────────────────────────────
let storageError=false;
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw)return initial();
    const v=JSON.parse(raw);
    if(!v.version||!Array.isArray(v.profiles)||!Array.isArray(v.plans)||!Array.isArray(v.sessions)||!v.ongoing)throw Error('invalid');
    // migrations
    if(!v.weights)v.weights={p1:[],p2:[]};
    if(!v.notifications)v.notifications={reminder:false,reminderTime:'07:00'};
    // ensure weight keys match profile ids
    v.profiles.forEach(p=>{if(!v.weights[p.id])v.weights[p.id]=[]});
    
    // Auto-inject Yasmin's 5-day workout if it's missing (migrating her plans)
    const yasminPlans = v.plans.filter(p => p.owner === 'p2');
    const hasFriday = yasminPlans.some(p => p.letter === 'E' && p.name.includes('Sexta'));
    if (!hasFriday) {
      // Remove old yasmin plans and add the new 5-day split
      v.plans = v.plans.filter(p => p.owner !== 'p2').concat(defaultPlansYasmin('p2'));
    }
    
    return v;
  }catch(e){storageError=true;return initial()}
}
let state=load();
let view='home',planOwner=state.active,selectedPlan=null,selectedDate=new Date();
let editing=null,timerHandle,toastHandle,storageWarned=false,pendingId=null;

function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));return true}
  catch(e){storageError=true;toast('Não foi possível salvar.',5000);return false}
}
function toast(text,time=3000){clearTimeout(toastHandle);$('#toast').textContent=text;toastHandle=setTimeout(()=>$('#toast').textContent='',time)}
function profile(id=state.active){return state.profiles.find(p=>p.id===id)||state.profiles[0]}
function initials(name){return name.trim().split(/\s+/).slice(0,2).map(s=>s[0]).join('').toUpperCase()}
function nameFirst(id=state.active){return profile(id).name.split(' ')[0]}
function dateKey(d){const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
function monday(d=new Date()){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
function weekSessions(id=state.active){const start=monday();const end=new Date(start);end.setDate(end.getDate()+7);return state.sessions.filter(s=>s.owner===id&&new Date(s.ended)>=start&&new Date(s.ended)<end)}
function plansFor(id=state.active){return state.plans.filter(p=>p.owner===id)}
function currentPlan(){return state.plans.find(p=>p.id===selectedPlan&&p.owner===state.active)||plansFor().find(p=>p.days.includes(selectedDate.getDay()))||null}
function totalSets(p){return p.exercises.reduce((n,e)=>n+e.sets,0)}
function totals(s){return s.exercises.reduce((o,e)=>{e.records.forEach(r=>{if(r.done){o.sets++;o.volume+=(Number(r.kg)||0)*(Number(r.reps)||0)}});return o},{sets:0,volume:0})}
function duration(s){return Math.max(1,Math.round((s.ended-s.started)/60000))}

// ── THEME ────────────────────────────────────────────────────────
function applyTheme(){
  const dark=state.theme==='dark'||state.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme=dark?'dark':'light';
  document.querySelector('meta[name="theme-color"]').content=dark?'#0d0f0e':'#f0f4ee';
  $('#theme-toggle').innerHTML=icon(dark?'sun':'moon');
  $('#theme-toggle').setAttribute('aria-label',dark?'Ativar tema claro':'Ativar tema escuro');
}

// ── RENDER ───────────────────────────────────────────────────────
function render(){
  applyTheme();
  const isY = state.active === 'p2';
  const labels={home:'Hoje',plans:isY?'Nossos Treinos':'Treinos',history:'Histórico',progress:isY?'Sua Evolução, Princesa':'Progresso',settings:'Ajustes',session:'Em andamento'};
  $('#page-label').textContent=labels[view]||'Hoje';
  $('#navigation').innerHTML=[
    ['home','home','Hoje'],
    ['plans','dumbbell','Treinos'],
    ['history','history','Histórico'],
    ['progress','trend','Progresso'],
    ['settings','settings','Ajustes'],
  ].map(([v,i,t])=>`<button data-nav="${v}" class="${view===v||view==='session'&&v==='home'?'active':''}" ${view===v?'aria-current="page"':''}>${icon(i)}<span>${t}</span></button>`).join('');

  const otherProfile=state.profiles.find(p=>p.id!==state.active);
  const swBtn=$('#switch-profile-btn');
  const activeName=$('#active-name');
  if(activeName)activeName.textContent=nameFirst();
  if(swBtn&&otherProfile){
    swBtn.textContent='Trocar para '+nameFirst(otherProfile.id);
    swBtn.dataset.switchTo=otherProfile.id;
  }
  $('#avatar').textContent=initials(profile().name);
  $('#avatar').className='avatar'+(state.active===state.profiles[0].id?'':' partner');
  const views={home:homeView,plans:plansView,history:historyView,progress:progressView,settings:settingsView,session:sessionView};
  $('#content').innerHTML=(views[view]||homeView)();
  $('#content').classList.remove('fade-in');
  void $('#content').offsetWidth;
  $('#content').classList.add('fade-in');
  renderRest();
  // re-init charts after render
  if(view==='progress'){setTimeout(initCharts,50)}
  if(storageError&&!storageWarned){storageWarned=true;toast('Armazenamento indisponível. Dados somente nesta sessão.',7000)}
}

// ── PROGRESS VIEW ─────────────────────────────────────────────────
function progressView(){
  const weights=state.weights[state.active]||[];
  const lastWeight=weights.length?weights[weights.length-1]:null;
  const weightDelta=weights.length>1?(weights[weights.length-1].kg-weights[weights.length-2].kg):0;

  // Personal records: best set per exercise
  const allSessions=state.sessions.filter(s=>s.owner===state.active);
  const prMap={};
  allSessions.forEach(s=>{
    s.exercises.forEach(e=>{
      e.records.filter(r=>r.done&&Number(r.kg)>0&&Number(r.reps)>0).forEach(r=>{
        const key=e.name.toLowerCase().trim();
        const val=Number(r.kg);
        if(!prMap[key]||val>prMap[key].kg)prMap[key]={name:e.name,kg:val,reps:Number(r.reps),date:s.ended};
      });
    });
  });
  const prs=Object.values(prMap).sort((a,b)=>b.kg-a.kg).slice(0,6);

  // Volume per week (last 8 weeks)
  const volumeData=[];const volumeLabels=[];
  for(let w=7;w>=0;w--){

    volumeData.push(Math.round(vol));
    volumeLabels.push(start.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}));
  }

  // Weight trend
  const wLabels=weights.slice(-8).map(w=>new Date(w.date).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}));
  const wData=weights.slice(-8).map(w=>w.kg);

  return heading('Progresso 📊',`Evolução de ${esc(nameFirst())}.`)+
  `<div class="progress-grid">
    <section class="card chart-card">
      <div class="row between" style="margin-bottom:14px"><h2>Volume semanal</h2><span class="badge blue">${icon('chart')} kg × reps</span></div>
      <div class="chart-wrap"><canvas id="chart-volume"></canvas></div>
    </section>
    <section class="card">
      <div class="row between" style="margin-bottom:16px">
        <h2>Peso corporal ${icon('weight','muted')}</h2>
        ${lastWeight?`<span class="badge ${weightDelta<=0?'green':'accent'}">${weightDelta>0?'+':''}${weightDelta.toFixed(1)} kg</span>`:''}
      </div>

        <button class="btn primary" id="weight-save-btn" style="min-width:100px">${icon('check')} Salvar</button>
      </div>
      ${weights.length>1?`<div class="chart-wrap" style="height:140px;margin-bottom:14px"><canvas id="chart-weight"></canvas></div>`:''}
      <div class="weight-log">${weights.slice(-6).reverse().map((w,i,arr)=>{
        const prev=arr[i+1];const delta=prev?w.kg-prev.kg:0;
        return `<div class="weight-row"><span><strong>${w.kg} kg</strong></span><span class="muted" style="font-size:12px">${new Date(w.date).toLocaleDateString('pt-BR')}</span>${prev?`<span class="weight-delta ${delta>0?'up':'down'}">${delta>0?'▲':'▼'} ${Math.abs(delta).toFixed(1)}</span>`:'<span class="badge">início</span>'}</div>`;
      }).join('')||'<p class="muted small">Nenhum registro ainda.</p>'}</div>
    </section>
    <section class="card">
      <div class="row between" style="margin-bottom:14px"><h2>Recordes pessoais 🏆</h2><span class="badge green">${prs.length} exercícios</span></div>
      ${prs.length?`<div class="pr-list">${prs.map(pr=>`<div class="pr-item"><div><div class="pr-num">${pr.kg} kg</div><small>${esc(pr.name)} · ${pr.reps} reps</small></div><small class="muted" style="margin-left:auto">${new Date(pr.date).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</small></div>`).join('')}</div>`:

      <div class="chart-wrap"><canvas id="chart-sessions"></canvas></div>
    </section>
  </div>`;
}

// ── INIT CHARTS ──────────────────────────────────────────────────
function initCharts(){
  if(typeof Chart==='undefined')return;
  const isDark=document.documentElement.dataset.theme==='dark';
  const gridColor=isDark?'#2a302c':'#cdd7c8';
  const textColor=isDark?'#7a8a78':'#5a6e58';
  const green='#a8ff6b';const greenFade=isDark?'#a8ff6b15':'#5ab82a20';
  const blue='#6bcfff';const blueFade='#6bcfff15';

  const baseOptions={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:isDark?'#1e2220':'#fff',titleColor:isDark?'#eef2ec':'#1a241a',bodyColor:isDark?'#7a8a78':'#5a6e58',borderColor:gridColor,borderWidth:1,cornerRadius:10,padding:10}},scales:{x:{grid:{color:gridColor},ticks:{color:textColor,font:{size:11}}},y:{grid:{color:gridColor},ticks:{color:textColor,font:{size:11}}}}};

  // Volume chart
  const cv=$('#chart-volume');
  if(cv){
    const allSessions=state.sessions.filter(s=>s.owner===state.active);
    const vData=[];const vLabels=[];
    for(let w=7;w>=0;w--){
      const start=monday(new Date(Date.now()-w*7*86400000));
      const end=new Date(start);end.setDate(end.getDate()+7);
      const wS=allSessions.filter(s=>new Date(s.ended)>=start&&new Date(s.ended)<end);
      vData.push(Math.round(wS.reduce((n,s)=>n+totals(s).volume,0)));
      vLabels.push(start.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}));
    }
    Chart.getChart(cv)?.destroy();
    new Chart(cv,{type:'bar',data:{labels:vLabels,datasets:[{data:vData,backgroundColor:vData.map(v=>v>0?green+'cc':gridColor),borderRadius:8,borderSkipped:false}]},options:{...baseOptions}});
  }

  // Sessions per week
  const cs=$('#chart-sessions');
  if(cs){
    const allSessions=state.sessions.filter(s=>s.owner===state.active);
    const sData=[];const sLabels=[];
    for(let w=7;w>=0;w--){
      const start=monday(new Date(Date.now()-w*7*86400000));
      const end=new Date(start);end.setDate(end.getDate()+7);
      sData.push(allSessions.filter(s=>new Date(s.ended)>=start&&new Date(s.ended)<end).length);
      sLabels.push(start.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}));
    }
    Chart.getChart(cs)?.destroy();
    new Chart(cs,{type:'line',data:{labels:sLabels,datasets:[{data:sData,borderColor:blue,backgroundColor:blueFade,fill:true,tension:.4,pointRadius:4,pointBackgroundColor:blue}]},options:{...baseOptions}});
  }

  // Weight chart
  const cw=$('#chart-weight');
  if(cw){
    const weights=(state.weights[state.active]||[]).slice(-8);
    const wLabels=weights.map(w=>new Date(w.date).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}));
    const wData=weights.map(w=>w.kg);
    Chart.getChart(cw)?.destroy();
    new Chart(cw,{type:'line',data:{labels:wLabels,datasets:[{data:wData,borderColor:green,backgroundColor:greenFade,fill:true,tension:.4,pointRadius:5,pointBackgroundColor:green}]},options:{...baseOptions,scales:{x:{...baseOptions.scales.x},y:{...baseOptions.scales.y,min:wData.length?Math.min(...wData)-3:50,max:wData.length?Math.max(...wData)+3:100}}}});
  }

  // Weight save button
  const wsBtn=$('#weight-save-btn');
  if(wsBtn&&!wsBtn.dataset.bound){
    wsBtn.dataset.bound='1';
    wsBtn.addEventListener('click',()=>{
      const input=$('#weight-input');
      const val=parseFloat(input.value);
      if(!val||val<30||val>300){toast('Informe um peso válido (30–300 kg).');return}
      if(!state.weights[state.active])state.weights[state.active]=[];
      state.weights[state.active].push({kg:val,date:Date.now()});
      save();toast('Peso registrado! 💪');navigate('progress');
    });
  }
}

// ── SESSION ───────────────────────────────────────────────────────
function previousRecord(ex,index){
  const last=state.sessions.filter(s=>s.owner===state.active).sort((a,b)=>b.ended-a.ended)
    .flatMap(s=>s.exercises).find(e=>e.name.trim().toLowerCase()===ex.name.trim().toLowerCase()&&e.records.some(r=>r.done));
  return last?.records.filter(r=>r.done)[index]||last?.records.find(r=>r.done)||null;
}
function startPlan(id){
  if(state.ongoing[state.active]){navigate('session');return}
  const p=state.plans.find(x=>x.id===id&&x.owner===state.active);
  if(!p)return;
  state.ongoing[state.active]={
    id:uid(),owner:state.active,planId:p.id,letter:p.letter,name:p.name,started:Date.now(),
    exercises:p.exercises.map(e=>({...clone(e),records:Array.from({length:e.sets},(_,i)=>{const old=previousRecord(e,i);return{kg:old?.kg??'',reps:old?.reps??'',done:false}}),sessionNotes:''}))
  };
  save();closeModal();navigate('session');
}

      <div>

    <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}">

          </div>
        </div>
        <div class="set-header"><span>Série</span><span>kg</span><span>Reps</span><span>✓</span></div>
        ${e.records.map((r,j)=>`<div class="set-row ${r.done?'done':''}" data-set-row="${i}-${j}">
          <span class="set-index">${j+1}</span>
          <input type="number" min="0" max="1500" step="0.25" inputmode="decimal" placeholder="—" value="${esc(r.kg)}" data-ex="${i}" data-set="${j}" data-field="kg" aria-label="kg série ${j+1}">

          <button class="set-check" data-action="check-set" data-ex="${i}" data-set="${j}" aria-label="${r.done?'Desmarcar':'Concluir'} série ${j+1}" aria-pressed="${r.done}">${icon('check')}</button>

function updateProgress(){
  const s=state.ongoing[state.active];if(!s)return;
  const done=totals(s).sets,total=s.exercises.reduce((n,e)=>n+e.records.length,0);
  const count=$('#session-count');const pct=$('#session-pct');const fill=$('#progress-fill');
  if(count)count.textContent=`${done} de ${total} séries`;
  if(pct)pct.textContent=`${Math.round(done/total*100)}%`;
  if(fill)fill.style.width=`${done/total*100}%`;
  const track=$('.progress-track');
  if(track)track.setAttribute('aria-valuenow',done);
}
function checkSet(i,j){
  const s=state.ongoing[state.active],e=s.exercises[i],r=e.records[j];
  if(!r.done&&(r.kg===''||r.reps===''||!Number.isFinite(Number(r.kg))||Number(r.kg)<0||Number(r.kg)>1500||!Number.isInteger(Number(r.reps))||Number(r.reps)<1||Number(r.reps)>500)){toast('Preencha carga (0 = peso corporal) e repetições.');return}
  r.done=!r.done;
  if(r.done){state.rest={owner:state.active,end:Date.now()+e.rest*1000,paused:false,remaining:0};if(navigator.vibrate)navigator.vibrate(30)}
  save();
  const row=$(`[data-set-row="${i}-${j}"]`);
  row.classList.toggle('done',r.done);
  const b=row.querySelector('button');
  b.setAttribute('aria-pressed',r.done);
  b.setAttribute('aria-label',`${r.done?'Desmarcar':'Concluir'} série ${j+1}`);
  updateProgress();renderRest();
}

// ── REST ─────────────────────────────────────────────────────────
function restSeconds(){if(!state.rest)return 0;return Math.max(0,Math.ceil((state.rest.paused?state.rest.remaining:state.rest.end-Date.now())/1000))}
function formatClock(s){return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`}
function renderRest(){
  const r=state.rest,el=$('#restbar');
  if(!r||r.owner!==state.active){el.classList.add('hidden');return}
  el.classList.remove('hidden');
  el.innerHTML=`${icon('clock','rest-icon')}<div class="grow"><small>DESCANSO${r.paused?' · PAUSADO':''}</small><strong id="rest-time">${formatClock(restSeconds())}</strong></div><button data-action="pause-rest" aria-label="${r.paused?'Retomar':'Pausar'}">${icon(r.paused?'play':'pause')}</button><button data-action="extend-rest">+30s</button><button data-action="skip-rest">Pular ${icon('chevron')}</button>`;
}
setInterval(()=>{
  if(state.rest&&!state.rest.paused){
    const secs=restSeconds();
    if(secs===0){state.rest=null;save();renderRest();toast('Descansou! Próxima série 💪')}
    else if($('#rest-time'))$('#rest-time').textContent=formatClock(secs);
  }
  const s=state.ongoing[state.active];
  if($('#elapsed')&&s)$('#elapsed').innerHTML=icon('clock')+' '+Math.floor((Date.now()-s.started)/60000)+' min';
},500);

  if(!editing.exercises.length){$('#edit-error').textContent='Adicione pelo menos um exercício.';return}
  if(!editing.name.trim()||!editing.letter.trim()||editing.exercises.some(e=>!e.name.trim()||!e.reps.trim())){$('#edit-error').textContent='Preencha nome, identificação e todos os exercícios.';return}
  editing.name=editing.name.trim();editing.demo=false;
  const i=state.plans.findIndex(p=>p.id===editing.id);
  if(i<0)state.plans.push(editing);else state.plans[i]=editing;
  save();closeModal();render();toast('Treino salvo! 💪');
}

// ── HISTORY DETAIL ───────────────────────────────────────────────
function showHistory(s,finished=false){
  const t=totals(s);
  const isY = s.owner === 'p2';
  const phrases = ['Muito bem, minha princesa! 🥰', 'Estou orgulhoso de você! ❤️', 'Arrasou, meu amor! 💖', 'Você é incrível! 😍'];
  const title = isY ? phrases[Math.floor(Math.random()*phrases.length)] : 'Treino concluído! 💪';
  const confetti=finished?`<div class="confetti-bar">${isY?'💖 🌹 🥰 ✨ 👑':'🎉 🐀 💪 🏆 ⚡'}</div>`:'';
  openModal(finished?title:esc(s.name),
  `${confetti}<div class="row between"><span class="badge green">${icon('check')} Salvo</span><span class="small muted">${new Date(s.ended).toLocaleDateString('pt-BR')}</span></div>
  ${finished?`<h2 style="margin-top:18px">${esc(s.name)}</h2>`:''}
  <p class="small muted" style="margin-top:6px">${esc(profile(s.owner).name)}</p>
  <div class="summary-grid">
    <div><span class="small muted">Duração</span><div class="summary-value">${duration(s)} <span class="small muted">min</span></div></div>
    <div><span class="small muted">Séries</span><div class="summary-value">${t.sets}</div></div>
    ${t.volume>0?`<div style="grid-column:1/-1"><span class="small muted">Volume total</span><div class="summary-value">${t.volume.toLocaleString('pt-BR')} <span class="small muted">kg</span></div></div>`:''}
  </div>
  ${s.exercises.map(e=>`<div class="history-ex"><h3>${esc(e.name)}</h3><p>${e.records.filter(r=>r.done).map(r=>`${esc(r.kg)} kg × ${esc(r.reps)}`).join(' &nbsp;·&nbsp; ')||'Nenhuma série'}</p>${e.sessionNotes?`<p>Obs.: ${esc(e.sessionNotes)}</p>`:''}</div>`).join('')}`,
  `<button class="btn primary" data-action="close-modal">${finished?(isY?'Te amo! ❤️':'Incrível, bora! 🐀'):'Fechar'} ${icon('check')}</button>`);
}

// ── FINISH SESSION ───────────────────────────────────────────────
function finish(){
  const s=state.ongoing[state.active];
  if(!totals(s).sets){toast('Conclua pelo menos uma série para salvar.');return}
  const total=s.exercises.reduce((n,e)=>n+e.records.length,0);
  if(totals(s).sets<total)confirmModal('Finalizar por hoje?',`Você concluiu ${totals(s).sets} de ${total} séries. As feitas serão salvas.`,'confirm-finish','Finalizar treino');
  else completeSession();
}
function completeSession(){
  const s=state.ongoing[state.active];
  s.ended=Date.now();
  state.sessions.push(clone(s));
  delete state.ongoing[state.active];
  if(state.rest?.owner===state.active)state.rest=null;
  save();closeModal();navigate('history');showHistory(s,true);
}

// ── NOTIFICATIONS ────────────────────────────────────────────────
async function requestNotifications(){
  if(!('Notification' in window)){toast('Notificações não suportadas neste navegador.');return false}
  if(Notification.permission==='granted')return true;
  const perm=await Notification.requestPermission();
  return perm==='granted';
}
function scheduleReminder(time){
  if(!time)return;
  // Store in localStorage for SW
  localStorage.setItem('rats-reminder-time',time);
  toast(`Lembrete às ${time} ativado! 🔔`);
}

// ── EVENTS ───────────────────────────────────────────────────────
document.addEventListener('click',event=>{
  const b=event.target.closest('button');if(!b)return;
  if(b.dataset.nav){navigate(b.dataset.nav);return}
  if(b.dataset.owner){planOwner=b.dataset.owner;render();return}
  if(b.dataset.themeChoice){state.theme=b.dataset.themeChoice;save();render();return}
  if(b.dataset.date){selectedDate=new Date(b.dataset.date+'T12:00:00');selectedPlan=null;render();return}
  const a=b.dataset.action,id=b.dataset.id,i=+b.dataset.index;if(!a)return;
  switch(a){
    case'close-modal':closeModal();break;
    case'choose':choosePlan();break;
    case'select-plan':selectedPlan=id;closeModal();navigate('home');break;
    case'start':startPlan(id);break;
    case'continue':navigate('session');break;
    case'new-plan':openEditor();break;
    case'edit-plan':openEditor(id);break;
    case'add-exercise':collectEditor();editing.exercises.push(exercise(''));renderEditor();break;
    case'remove-exercise':collectEditor();editing.exercises.splice(i,1);renderEditor();break;
    case'move-up':case'move-down':collectEditor();const to=a==='move-up'?i-1:i+1;[editing.exercises[i],editing.exercises[to]]=[editing.exercises[to],editing.exercises[i]];renderEditor();break;
    case'delete-plan':pendingId=id;confirmModal('Excluir treino?','O plano será removido. Histórico preservado.','confirm-delete','Excluir',true);break;
    case'confirm-delete':state.plans=state.plans.filter(p=>p.id!==pendingId);save();closeModal();render();toast('Treino excluído.');break;
    case'duplicate':pendingId=id;openModal('Duplicar treino',`<label class="field">Para qual perfil?<select id="duplicate-owner">${state.profiles.map(p=>`<option value="${p.id}" ${p.id===planOwner?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>`,`<button class="btn" data-action="close-modal">Cancelar</button><button class="btn primary" data-action="confirm-duplicate">Duplicar</button>`);break;
    case'confirm-duplicate':const p=clone(state.plans.find(x=>x.id===pendingId));p.id=uid();p.owner=$('#duplicate-owner').value;p.name+=' (cópia)';p.demo=false;p.exercises.forEach(e=>e.id=uid());state.plans.push(p);planOwner=p.owner;save();closeModal();render();toast('Treino duplicado!');break;
    case'check-set':checkSet(+b.dataset.ex,+b.dataset.set);break;
    case'pause-rest':if(state.rest){if(state.rest.paused){state.rest.end=Date.now()+state.rest.remaining;state.rest.paused=false}else{state.rest.remaining=Math.max(0,state.rest.end-Date.now());state.rest.paused=true}save();renderRest()}break;
    case'extend-rest':if(state.rest){if(state.rest.paused)state.rest.remaining+=30000;else state.rest.end+=30000;save();renderRest()}break;
    case'skip-rest':state.rest=null;save();renderRest();break;
    case'finish':finish();break;
    case'confirm-finish':completeSession();break;
    case'discard':confirmModal('Descartar sessão?','As séries desta sessão serão removidas. Plano e histórico permanecem.','confirm-discard','Descartar',true);break;
    case'confirm-discard':delete state.ongoing[state.active];if(state.rest?.owner===state.active)state.rest=null;save();closeModal();navigate('home');break;
    case'history-detail':showHistory(state.sessions.find(s=>s.id===id));break;
    case'export':{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='casal-rats-'+dateKey(new Date())+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Dados exportados! 📁');break;}
    case'reset':confirmModal('Recomeçar do zero?','Todos os dados serão apagados. Exporte antes de continuar.','confirm-reset','Apagar tudo',true);break;
    case'confirm-reset':state=initial();selectedPlan=null;planOwner=state.active;selectedDate=new Date();save();closeModal();navigate('home');toast('Recomeçado! Bora treinar 🐀');break;
  }
});

document.addEventListener('click',event=>{
  // Notification toggle
  const toggle=event.target.closest('#toggle-reminder');
  if(toggle){
    const notif=state.notifications||{reminder:false,reminderTime:'07:00'};
    if(!notif.reminder){
      requestNotifications().then(granted=>{
        if(granted){notif.reminder=true;state.notifications=notif;save();render();scheduleReminder(notif.reminderTime)}
        else toast('Permissão de notificações negada.');
      });
    }else{notif.reminder=false;state.notifications=notif;save();render();toast('Lembrete desativado.');}
    return;
  }
});

document.addEventListener('input',event=>{
  const el=event.target;
  if(el.dataset.field){
    const s=state.ongoing[state.active];if(!s)return;
    const r=s.exercises[+el.dataset.ex].records[+el.dataset.set];
    r[el.dataset.field]=el.value;
    if(r.done){r.done=false;const row=el.closest('.set-row');row.classList.remove('done');row.querySelector('button').setAttribute('aria-pressed','false');updateProgress()}
    save();
  }
  if(el.dataset.notes!==undefined){const s=state.ongoing[state.active];if(s){s.exercises[+el.dataset.notes].sessionNotes=el.value;save()}}
  if(el.id==='notif-time'){const notif=state.notifications||{};notif.reminderTime=el.value;state.notifications=notif;save();if(notif.reminder)scheduleReminder(el.value);}
});

document.addEventListener('submit',event=>{
  if(event.target.id==='plan-form'){event.preventDefault();savePlan()}
  if(event.target.id==='profiles-form'){
    event.preventDefault();
    const form=new FormData(event.target);
    if(state.profiles.some(p=>!String(form.get(p.id)).trim())){toast('Preencha os dois nomes.');return}
    const oldIds=state.profiles.map(p=>p.id);
    state.profiles.forEach(p=>{p.name=String(form.get(p.id)).trim()});
    // ensure weight keys exist
    state.profiles.forEach(p=>{if(!state.weights[p.id])state.weights[p.id]=[]});
    save();render();toast('Nomes atualizados! 🐀🐀');
  }
});

document.addEventListener('click',e=>{
  const btn=e.target.closest('#switch-profile-btn');
  if(btn&&btn.dataset.switchTo){
    state.active=btn.dataset.switchTo;planOwner=state.active;selectedPlan=null;
    save();navigate('home');toast('Agora é o perfil de '+profile().name+' 🐀');
  }
});
$('#theme-toggle').addEventListener('click',()=>{state.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();render()});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.theme==='system')applyTheme()});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const next=JSON.parse(e.newValue);if(next.version){state=next;planOwner=state.active;render();toast('Dados atualizados em outra aba.')}}catch{}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)renderRest()});

render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
