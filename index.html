<body>
<div class="shell">
<aside class="sidebar"><div class="brand"><span class="brandmark">r</span><span class="brandtext">ritmo<small>®</small></span></div><nav class="nav" aria-label="Navegação principal" id="navigation"></nav><div class="sidebar-bottom"><div class="private-note"><span id="lock-icon"></span><div><strong>Seu espaço de treino</strong>Uma série de cada vez.</div></div></div></aside>
<main class="main"><header class="topbar"><div class="breadcrumb">Meu espaço <span>/ &nbsp; <b id="page-label">Hoje</b></span></div><div class="brand mobile-brand"><span class="brandmark">r</span>ritmo</div><div class="profile-wrap"><button class="iconbtn" id="theme-toggle" aria-label="Alternar tema"></button><div class="profile-picker"><span class="avatar" id="avatar">JP</span><select id="profile-select" aria-label="Perfil demonstrativo ativo"></select></div></div></header><div id="content" class="content"></div></main>

<script>
'use strict';
const paths={home:'M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z',dumbbell:'m6.5 6.5 11 11M4 9 9 4M15 20l5-5M2 7l5-5M17 22l5-5M5 11l6-6M13 19l6-6',history:'M3 11a9 9 0 1 1 2.3 7M3 4v7h7M12 7v5l3 2',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M9 3l-1 3-3 1-2 3 2 2-1 3 2 3 3-1 2 4h3l1-3 3-1 2-3-2-2 1-3-2-3-3 1-2-4Z',sun:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1 1M18 18l1 1M5 19l1-1M18 6l1-1',moon:'M20.5 13A8.5 8.5 0 0 1 11 3.5 8.5 8.5 0 1 0 20.5 13Z',arrow:'M4 12h16m-6-6 6 6-6 6',chevron:'m9 5 7 7-7 7',down:'m6 9 6 6 6-6',up:'m6 15 6-6 6 6',clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M12 7v5l3 2',check:'m5 12 4 4L19 6',plus:'M12 5v14M5 12h14',close:'m6 6 12 12M6 18 18 6',edit:'m15 4 5 5M4 20l5-1L21 7l-5-5L4 14Z',copy:'M8 8h12v13H8ZM4 16H2V2h13v3',trash:'M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7',calendar:'M3 5h18v16H3ZM7 2v6M17 2v6M3 10h18',lock:'M7 11V7a5 5 0 0 1 10 0v4M5 11h14v10H5ZM12 15v2',info:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M12 11v6M12 7h.01',pause:'M9 5v14M15 5v14',play:'m8 4 12 8-12 8Z',back:'M20 12H4m6-6-6 6 6 6',monitor:'M3 3h18v13H3ZM12 16v5M8 21h8',download:'M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5',trophy:'M7 3h10v6a5 5 0 0 1-10 0ZM7 5H3v3a4 4 0 0 0 4 4M17 5h4v3a4 4 0 0 1-4 4M12 14v7M8 21h8',share:'M12 15V2m-4 4 4-4 4 4M7 9H4v12h16V9h-3'};
function icon(name,cls=''){return `<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.dumbbell}"/></svg>`}
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const clone=v=>JSON.parse(JSON.stringify(v));
const KEY='ritmo-app-v1';const dayNames=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function exercise(name,sets=3,reps='10–12',rest=60){return{id:uid(),name,sets,reps,rest,notes:''}}
function defaultPlans(owner){return [
{id:uid(),owner,letter:'A',name:'Peito e tríceps',days:[1,4],exercises:[exercise('Supino reto',4,'8–12',90),exercise('Supino inclinado com halteres'),exercise('Crucifixo na máquina'),exercise('Tríceps na polia'),exercise('Tríceps francês')],demo:true},
{id:uid(),owner,letter:'B',name:'Costas e bíceps',days:[2,5],exercises:[exercise('Puxada frontal',4,'8–12',90),exercise('Remada baixa'),exercise('Remada unilateral'),exercise('Rosca direta'),exercise('Rosca martelo')],demo:true},
{id:uid(),owner,letter:'C',name:'Pernas e ombros',days:[3],exercises:[exercise('Agachamento livre',4,'8–10',120),exercise('Leg press',3,'10–12',90),exercise('Cadeira extensora'),exercise('Mesa flexora'),exercise('Elevação lateral'),exercise('Panturrilha em pé',3,'12–15',60)],demo:true}];}
function initial(){return{version:1,profiles:[{id:'joao',name:'João Pedro'},{id:'parceira',name:'Meu par'}],active:'joao',theme:'dark',plans:[...defaultPlans('joao'),...defaultPlans('parceira')],sessions:[],ongoing:{},rest:null}}
let storageError=false;function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return initial();const v=JSON.parse(raw);if(v.version!==1||!Array.isArray(v.profiles)||!Array.isArray(v.plans)||!Array.isArray(v.sessions)||!v.ongoing)throw Error('invalid');return v}catch(e){storageError=true;return initial()}}
let state=load(),view='home',planOwner=state.active,selectedPlan=null,selectedDate=new Date(),editing=null,timerHandle,toastHandle,storageWarned=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){storageError=true;toast('Não foi possível salvar neste navegador. Seus dados estão apenas nesta sessão.',8000);return false}}
function toast(text,time=3200){clearTimeout(toastHandle);$('#toast').textContent=text;toastHandle=setTimeout(()=>$('#toast').textContent='',time)}
function profile(id=state.active){return state.profiles.find(p=>p.id===id)||state.profiles[0]}
function initials(name){return name.trim().split(/\s+/).slice(0,2).map(s=>s[0]).join('').toUpperCase()}
function nameFirst(id=state.active){return profile(id).name.split(' ')[0]}
function dateKey(d){const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
function monday(d=new Date()){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
function weekSessions(){const start=monday();const end=new Date(start);end.setDate(end.getDate()+7);return state.sessions.filter(s=>s.owner===state.active&&new Date(s.ended)>=start&&new Date(s.ended)<end)}
function plansFor(id=state.active){return state.plans.filter(p=>p.owner===id)}
function currentPlan(){return state.plans.find(p=>p.id===selectedPlan&&p.owner===state.active)||plansFor().find(p=>p.days.includes(selectedDate.getDay()))||null}
function totalSets(p){return p.exercises.reduce((n,e)=>n+e.sets,0)}
function totals(s){return s.exercises.reduce((o,e)=>{e.records.forEach(r=>{if(r.done){o.sets++;o.volume+=(Number(r.kg)||0)*(Number(r.reps)||0)}});return o},{sets:0,volume:0})}
function duration(s){return Math.max(1,Math.round((s.ended-s.started)/60000))}
function applyTheme(){const dark=state.theme==='dark'||state.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.theme=dark?'dark':'light';document.querySelector('meta[name="theme-color"]').content=dark?'#141615':'#f4f6f1';$('#theme-toggle').innerHTML=icon(dark?'sun':'moon');$('#theme-toggle').setAttribute('aria-label',dark?'Ativar tema claro':'Ativar tema escuro')}
function navigate(v){view=v;render();window.scrollTo({top:0,behavior:'instant'})}
function render(){applyTheme();const labels={home:'Hoje',plans:'Treinos',history:'Histórico',settings:'Ajustes',session:'Treino em andamento'};$('#page-label').textContent=labels[view];$('#navigation').innerHTML=[['home','home','Hoje'],['plans','dumbbell','Treinos'],['history','history','Histórico'],['settings','settings','Ajustes']].map(([v,i,t])=>`<button data-nav="${v}" class="${view===v||view==='session'&&v==='home'?'active':''}" ${view===v?'aria-current="page"':''}>${icon(i)}<span>${t}</span></button>`).join('');$('#lock-icon').innerHTML=icon('lock');$('#profile-select').innerHTML=state.profiles.map(p=>`<option value="${p.id}" ${p.id===state.active?'selected':''}>${esc(p.name)}</option>`).join('');$('#avatar').textContent=initials(profile().name);$('#avatar').classList.toggle('partner',state.active==='parceira');$('#content').innerHTML=({home:homeView,plans:plansView,history:historyView,settings:settingsView,session:sessionView}[view]||homeView)();$('#content').classList.remove('fade-in');void $('#content').offsetWidth;$('#content').classList.add('fade-in');renderRest();if(storageError&&!storageWarned){storageWarned=true;toast('Armazenamento indisponível ou dados inválidos. Esta sessão pode não ser salva.',8000)}}
function heading(title,sub='',extra=''){return `<div class="heading"><div class="row between wrap"><h1>${title}</h1>${extra}</div>${sub?`<p>${sub}</p>`:''}</div>`}
function homeView(){const plan=currentPlan(),ongoing=state.ongoing[state.active],ws=weekSessions(),sets=ws.reduce((n,s)=>n+totals(s).sets,0),mins=ws.reduce((n,s)=>n+duration(s),0),scheduledDays=new Set(plansFor().flatMap(p=>p.days)).size,goal=Math.max(1,scheduledDays),pct=Math.min(100,Math.round(ws.length/goal*100));const start=monday();let days='';for(let i=0;i<7;i++){const d=new Date(start);d.setDate(d.getDate()+i);const done=state.sessions.some(s=>s.owner===state.active&&dateKey(s.ended)===dateKey(d));days+=`<button class="day ${dateKey(d)===dateKey(selectedDate)?'current':''} ${done?'completed':''}" data-date="${dateKey(d)}" aria-label="${dayNames[d.getDay()]} ${d.getDate()}${done?', treino concluído':''}" aria-pressed="${dateKey(d)===dateKey(selectedDate)}"><span>${dayNames[d.getDay()]}</span><span class="daynum">${d.getDate()}</span><span class="daydot ${!plansFor().some(p=>p.days.includes(d.getDay()))&&!done?'off':''}"></span></button>`}
return `<div class="heading"><div class="date-line eyebrow">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</div><h1>Vamos treinar, ${esc(nameFirst())}.</h1><p>Um passo de cada vez. Uma série de cada vez.</p></div><div class="dashboard"><div class="stack"><section class="hero"><div><div class="hero-top"><span class="eyebrow">${ongoing?'Em andamento':dateKey(selectedDate)===dateKey(new Date())?'Seu treino de hoje':'Treino de '+dayNames[selectedDate.getDay()]}</span><span class="badge">${ongoing?esc(ongoing.letter):plan?'Treino '+esc(plan.letter):'Pausa'}</span></div><h2>${ongoing?esc(ongoing.name):plan?esc(plan.name):'Dia de recuperar.'}</h2><div class="hero-meta"><span>${icon('dumbbell')}${ongoing?ongoing.exercises.length:plan?plan.exercises.length:0} exercícios</span><span>${icon('clock')}${ongoing?ongoing.exercises.reduce((n,e)=>n+e.records.length,0):plan?totalSets(plan):0} séries</span></div></div><button class="btn dark" data-action="${ongoing?'continue':plan?'start':'choose'}" ${plan?`data-id="${plan.id}"`:''}>${icon(ongoing?'play':plan?'play':'plus')}${ongoing?'Continuar treino':plan?'Começar treino':'Escolher um treino'}<span class="grow"></span>${icon('arrow')}</button></section><div><div class="section-title"><h2>Na sua sequência</h2><button class="linkbtn" data-action="choose">Trocar treino ${icon('down')}</button></div>${plan?`<div class="exercise-list">${plan.exercises.map((e,i)=>`<div class="exercise-row"><span class="exercise-number">${String(i+1).padStart(2,'0')}</span><div class="grow"><h3>${esc(e.name)}</h3><p>${e.sets} séries · ${esc(e.reps)} repetições</p></div><span class="exercise-count">${e.rest}s</span></div>`).join('')}</div>`:`<div class="card empty">${icon('calendar')}<h2>Uma pausa também faz parte</h2><p>Você pode descansar ou escolher outro treino para hoje.</p><button class="btn" data-action="choose">Ver meus treinos</button></div>`}</div></div><div class="stack right-stack"><section class="card"><div class="row between"><h2>Sua semana</h2><span class="small muted">${new Date().toLocaleDateString('pt-BR',{month:'short'}).replace('.','')}</span></div><div class="week">${days}</div><div class="schedule-foot">${icon('calendar')} ${scheduledDays} dias de treino no seu plano</div></section><section class="card"><div class="row between"><h2>Seu ritmo</h2>${icon('trophy')}</div><div class="stats"><div><div class="stats-num">${ws.length}<span> / ${goal}</span></div><small>treinos nesta semana</small></div><div class="ring"><svg viewBox="0 0 100 100" role="img" aria-label="${pct}% da frequência semanal"><circle cx="50" cy="50" r="40" style="stroke:var(--line)"/><circle cx="50" cy="50" r="40" style="stroke:var(--green);stroke-dasharray:${pct*2.513} 251.3;stroke-linecap:round"/></svg><div class="ring-value">${pct}%</div></div></div><div class="stat-foot"><div><strong>${mins} <span class="small muted">min</span></strong><small>tempo de treino</small></div><div><strong>${sets}</strong><small>séries concluídas</small></div></div></section><div class="mini-note">${icon('info')}<span>Os treinos iniciais são exemplos. Ajuste os exercícios, séries e cargas à sua rotina em <strong>Treinos</strong>.</span></div></div></div><div class="demo-footer">Versão de comparação · dados salvos neste navegador</div>`}
function ownerTabs(){return `<div class="segmented" aria-label="Dono do plano">${state.profiles.map(p=>`<button class="${p.id===planOwner?'selected':''}" data-owner="${p.id}" aria-pressed="${p.id===planOwner}">${esc(p.name.split(' ')[0])}</button>`).join('')}</div>`}
function plansView(){return heading('Seu plano, do seu jeito.','Organize os exercícios e deixe o próximo treino pronto.')+`<div class="toolbar">${ownerTabs()}<button class="btn primary" data-action="new-plan">${icon('plus')}Novo treino</button></div><p class="small muted" style="margin-bottom:17px">Editando os planos de ${esc(profile(planOwner).name)}</p><div class="plans-grid">${plansFor(planOwner).map(p=>`<article class="card plan-card"><div class="row between"><span class="plan-letter">${esc(p.letter)}</span>${p.demo?'<span class="badge">Exemplo editável</span>':''}</div><h2>${esc(p.name)}</h2><p class="muted">${p.exercises.length} exercícios · ${totalSets(p)} séries</p><p class="small muted" style="margin-top:13px">${icon('calendar')} &nbsp;${p.days.length?p.days.map(d=>dayNames[d]).join(' · '):'Sem dia fixo'}</p><div class="plan-bottom"><button class="btn full" data-action="edit-plan" data-id="${p.id}">${icon('edit')}Editar treino</button><div class="plan-actions"><button class="btn ghost" data-action="duplicate" data-id="${p.id}">${icon('copy')}Duplicar</button><button class="btn ghost danger" data-action="delete-plan" data-id="${p.id}" aria-label="Excluir treino ${esc(p.name)}">${icon('trash')}</button></div></div></article>`).join('')||`<div class="card empty">${icon('dumbbell')}<h2>Um novo começo</h2><p>Crie o primeiro treino deste perfil.</p><button class="btn primary" data-action="new-plan">Criar treino</button></div>`}</div>`}
function historyView(){const sessions=state.sessions.filter(s=>s.owner===state.active).sort((a,b)=>b.ended-a.ended);return heading('Cada treino conta.',`Histórico de ${esc(profile().name)}.`)+(!sessions.length?`<section class="card empty">${icon('history')}<h2>Sua história começa aqui</h2><p>Quando você concluir um treino, suas séries e cargas aparecerão aqui.</p><button class="btn primary" data-nav="home">Ir para meu treino ${icon('arrow')}</button></section>`:sessions.map(s=>`<button class="history-item" data-action="history-detail" data-id="${s.id}"><span class="history-date"><b>${new Date(s.ended).getDate()}</b><small>${new Date(s.ended).toLocaleDateString('pt-BR',{month:'short'})}</small></span><div class="grow"><h3>${esc(s.name)}</h3><p>${duration(s)} min · ${totals(s).sets} séries · ${new Date(s.ended).getFullYear()}</p></div>${icon('chevron')}</button>`).join(''))}
function settingsView(){return heading('Seu espaço. Suas escolhas.','Deixe o Ritmo com a sua cara.')+`<div class="settings-grid"><section class="card"><h2>Perfis do casal</h2><p class="small muted" style="margin-bottom:20px">Cada perfil tem seu próprio histórico. Os dois podem editar os planos neste aparelho.</p><form id="profiles-form" class="stack">${state.profiles.map(p=>`<label class="field">${p.id==='joao'?'Seu nome':'Nome do seu par'}<input required maxlength="35" name="${p.id}" value="${esc(p.name)}" autocomplete="off"></label>`).join('')}<button class="btn primary" type="submit">Salvar nomes</button></form></section><section class="card"><h2>Aparência</h2><p class="small muted" style="margin-bottom:20px">Escolha o tema que combina com você.</p><div class="theme-choices">${[['dark','moon','Escuro'],['light','sun','Claro'],['system','monitor','Sistema']].map(([v,i,t])=>`<button class="theme-choice ${state.theme===v?'selected':''}" data-theme-choice="${v}" aria-pressed="${state.theme===v}">${icon(i)}${t}</button>`).join('')}</div></section><section class="card"><h2>No seu iPhone</h2><div class="row" style="align-items:start"><span class="exercise-number">${icon('share')}</span><p class="muted" style="font-size:14px">Depois de hospedar o app, abra o endereço no Safari, toque em <strong>Compartilhar</strong> e escolha <strong>Adicionar à Tela de Início</strong>.</p></div></section><section class="card"><h2>Seus dados</h2><p class="muted" style="font-size:14px">Esta versão salva os treinos somente neste navegador. Ainda não há login nem sincronização entre aparelhos. Exporte uma cópia antes de limpar os dados do navegador.</p><div class="setting-actions"><button class="btn" data-action="export">${icon('download')}Exportar dados</button><button class="btn ghost danger" data-action="reset">Recomeçar demonstração</button></div></section></div><div class="demo-footer">Ritmo · versão 1.0 de comparação</div>`}
function previousRecord(ex,index){const last=state.sessions.filter(s=>s.owner===state.active).sort((a,b)=>b.ended-a.ended).flatMap(s=>s.exercises).find(e=>e.name.trim().toLowerCase()===ex.name.trim().toLowerCase()&&e.records.some(r=>r.done));return last?.records.filter(r=>r.done)[index]||last?.records.find(r=>r.done)||null}
function startPlan(id){if(state.ongoing[state.active]){navigate('session');return}const p=state.plans.find(x=>x.id===id&&x.owner===state.active);if(!p)return;state.ongoing[state.active]={id:uid(),owner:state.active,planId:p.id,letter:p.letter,name:p.name,started:Date.now(),exercises:p.exercises.map(e=>({...clone(e),records:Array.from({length:e.sets},(_,i)=>{const old=previousRecord(e,i);return{kg:old?.kg??'',reps:old?.reps??'',done:false}}),sessionNotes:''}))};save();closeModal();navigate('session')}
function sessionView(){const s=state.ongoing[state.active];if(!s){view='home';return homeView()}const done=totals(s).sets,total=s.exercises.reduce((n,e)=>n+e.records.length,0);return `<div class="session-shell"><button class="linkbtn" data-nav="home" style="margin-bottom:20px">${icon('back')}Voltar para hoje</button><div class="session-info"><div><div class="session-label">${icon('dumbbell')}Treino ${esc(s.letter)} · ${esc(nameFirst())}</div><h1 style="margin-top:7px">${esc(s.name)}</h1></div><span class="badge" id="elapsed">${icon('clock')} ${Math.floor((Date.now()-s.started)/60000)} min</span></div><div class="row between small muted"><span id="session-count">${done} de ${total} séries</span><span id="session-pct">${total?Math.round(done/total*100):0}%</span></div><div class="progress-track" role="progressbar" aria-label="Séries concluídas" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><div class="progress-fill" style="width:${total?done/total*100:0}%"></div></div>${s.exercises.map((e,i)=>{const old=previousRecord(e,0);return `<section class="card session-exercise"><div class="exercise-top"><span class="exercise-number">${String(i+1).padStart(2,'0')}</span><div class="grow"><h3>${esc(e.name)}</h3><p>${esc(e.reps)} repetições · ${e.rest}s de descanso</p><p>${old?`Último registro: ${esc(old.kg)} kg × ${esc(old.reps)} rep.`:'Primeiro registro deste exercício'}</p>${e.notes?`<p>${esc(e.notes)}</p>`:''}</div></div><div class="set-header"><span>Série</span><span>kg</span><span>repetições</span><span>feito</span></div>${e.records.map((r,j)=>`<div class="set-row ${r.done?'done':''}" data-set-row="${i}-${j}"><span class="set-index">${j+1}</span><input type="number" min="0" max="1500" step="0.25" inputmode="decimal" placeholder="—" value="${esc(r.kg)}" data-ex="${i}" data-set="${j}" data-field="kg" aria-label="Carga em kg, ${esc(e.name)}, série ${j+1}"><input type="number" min="1" max="500" step="1" inputmode="numeric" placeholder="—" value="${esc(r.reps)}" data-ex="${i}" data-set="${j}" data-field="reps" aria-label="Repetições, ${esc(e.name)}, série ${j+1}"><button class="set-check" data-action="check-set" data-ex="${i}" data-set="${j}" aria-label="${r.done?'Desmarcar':'Concluir'} série ${j+1} de ${esc(e.name)}" aria-pressed="${r.done}">${icon('check')}</button></div>`).join('')}<input class="notes-input" data-notes="${i}" value="${esc(e.sessionNotes)}" placeholder="+ Adicionar uma observação" maxlength="300" aria-label="Observação de ${esc(e.name)}"></section>`}).join('')}<div class="session-bottom"><button class="btn primary" data-action="finish">${icon('check')}Finalizar treino</button><button class="btn ghost danger" data-action="discard">Descartar sessão</button></div></div>`}
function updateProgress(){const s=state.ongoing[state.active];if(!s)return;const done=totals(s).sets,total=s.exercises.reduce((n,e)=>n+e.records.length,0);$('#session-count').textContent=`${done} de ${total} séries`;$('#session-pct').textContent=`${Math.round(done/total*100)}%`;$('.progress-fill').style.width=`${done/total*100}%`;$('.progress-track').setAttribute('aria-valuenow',done)}
function checkSet(i,j){const s=state.ongoing[state.active],e=s.exercises[i],r=e.records[j];if(!r.done&&(r.kg===''||r.reps===''||!Number.isFinite(Number(r.kg))||Number(r.kg)<0||Number(r.kg)>1500||!Number.isInteger(Number(r.reps))||Number(r.reps)<1||Number(r.reps)>500)){toast('Preencha uma carga válida (0 para peso corporal) e as repetições.');return}r.done=!r.done;if(r.done){state.rest={owner:state.active,end:Date.now()+e.rest*1000,paused:false,remaining:0};if(navigator.vibrate)navigator.vibrate(25)}save();const row=$(`[data-set-row="${i}-${j}"]`);row.classList.toggle('done',r.done);const b=row.querySelector('button');b.setAttribute('aria-pressed',r.done);b.setAttribute('aria-label',`${r.done?'Desmarcar':'Concluir'} série ${j+1} de ${e.name}`);updateProgress();renderRest()}
function restSeconds(){if(!state.rest)return 0;return Math.max(0,Math.ceil((state.rest.paused?state.rest.remaining:state.rest.end-Date.now())/1000))}
function renderRest(){const r=state.rest,el=$('#restbar');if(!r||r.owner!==state.active){el.classList.add('hidden');return}el.classList.remove('hidden');el.innerHTML=`${icon('clock','rest-icon')}<div class="grow"><small>DESCANSO${r.paused?' · PAUSADO':''}</small><strong id="rest-time">${formatClock(restSeconds())}</strong></div><button data-action="pause-rest" aria-label="${r.paused?'Retomar':'Pausar'} descanso">${icon(r.paused?'play':'pause')}</button><button data-action="extend-rest">+30s</button><button data-action="skip-rest">Pular ${icon('chevron')}</button>`}
function formatClock(s){return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`}
setInterval(()=>{if(state.rest&&!state.rest.paused){const secs=restSeconds();if(secs===0){state.rest=null;save();renderRest();toast('Descanso concluído. Vamos para a próxima série?')}else if($('#rest-time'))$('#rest-time').textContent=formatClock(secs)}const s=state.ongoing[state.active];if($('#elapsed')&&s)$('#elapsed').innerHTML=icon('clock')+' '+Math.floor((Date.now()-s.started)/60000)+' min'},500);
function openModal(title,body,foot=''){const m=$('#modal');m.innerHTML=`<div class="modal-head"><h2 id="modal-title">${title}</h2><button class="iconbtn" data-action="close-modal" aria-label="Fechar">${icon('close')}</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}`;if(!m.open)m.showModal()}
function closeModal(){$('#modal').close();editing=null}
function confirmModal(title,text,action,label='Confirmar',danger=false){openModal(title,`<p class="muted">${text}</p>`,`<button class="btn" data-action="close-modal">Cancelar</button><button class="btn ${danger?'danger':'primary'}" data-action="${action}">${label}</button>`)}
function choosePlan(){openModal('Qual vai ser o treino?',`<div class="stack">${plansFor().map(p=>`<button class="history-item" style="margin:0" data-action="select-plan" data-id="${p.id}"><span class="exercise-number">${esc(p.letter)}</span><div class="grow"><h3>${esc(p.name)}</h3><p>${p.exercises.length} exercícios · ${totalSets(p)} séries</p></div>${icon('chevron')}</button>`).join('')||'<p class="muted">Crie um treino na aba Treinos para começar.</p>'}</div>`)}
function openEditor(id){editing=id?clone(state.plans.find(p=>p.id===id)):{id:uid(),owner:planOwner,letter:String.fromCharCode(65+plansFor(planOwner).length%26),name:'',days:[],exercises:[exercise('')],demo:false};renderEditor()}
function renderEditor(){const p=editing;openModal(state.plans.some(x=>x.id===p.id)?'Editar treino':'Novo treino',`<form id="plan-form"><div class="form-grid"><label class="field">Nome do treino<input required maxlength="60" name="plan-name" value="${esc(p.name)}" placeholder="Ex.: Peito e tríceps"></label><label class="field">Identificação<input required maxlength="3" name="plan-letter" value="${esc(p.letter)}" placeholder="A"></label></div><p class="small muted" style="margin-top:17px">Plano de ${esc(profile(p.owner).name)} · dias da semana</p><div class="edit-day">${[1,2,3,4,5,6,0].map(d=>`<label><input type="checkbox" name="day" value="${d}" ${p.days.includes(d)?'checked':''}><span>${dayNames[d]}</span></label>`).join('')}</div><h3>Exercícios</h3><datalist id="exercise-options">${['Supino reto','Supino inclinado com halteres','Crucifixo na máquina','Tríceps na polia','Tríceps francês','Puxada frontal','Remada baixa','Rosca direta','Rosca martelo','Agachamento livre','Leg press','Cadeira extensora','Mesa flexora','Elevação pélvica','Stiff','Elevação lateral','Desenvolvimento com halteres','Panturrilha em pé'].map(n=>`<option value="${n}">`).join('')}</datalist>${p.exercises.map((e,i)=>`<div class="edit-exercise" data-edit-ex="${i}"><div class="row between" style="margin-bottom:10px"><span class="small muted">Exercício ${i+1}</span><div class="edit-tools"><button type="button" class="iconbtn" data-action="move-up" data-index="${i}" aria-label="Mover exercício para cima" ${i===0?'disabled':''}>${icon('up')}</button><button type="button" class="iconbtn" data-action="move-down" data-index="${i}" aria-label="Mover exercício para baixo" ${i===p.exercises.length-1?'disabled':''}>${icon('down')}</button><button type="button" class="iconbtn" data-action="remove-exercise" data-index="${i}" aria-label="Remover exercício">${icon('trash')}</button></div></div><label class="field">Nome<input required maxlength="80" list="exercise-options" data-edit-field="name" value="${esc(e.name)}" placeholder="Escolha ou digite um exercício"></label><div class="exercise-fields"><label class="field">Séries<input type="number" min="1" max="12" required data-edit-field="sets" value="${e.sets}"></label><label class="field">Repetições<input required maxlength="20" data-edit-field="reps" value="${esc(e.reps)}"></label><label class="field">Descanso (s)<input type="number" min="5" max="600" step="5" required data-edit-field="rest" value="${e.rest}"></label></div><label class="field" style="margin-top:10px">Observação<input maxlength="200" data-edit-field="notes" value="${esc(e.notes)}" placeholder="Opcional"></label></div>`).join('')}<button type="button" class="btn full" style="margin-top:16px" data-action="add-exercise">${icon('plus')}Adicionar exercício</button><p id="edit-error" class="inline-error" role="alert"></p></form>`,`<button class="btn" data-action="close-modal">Cancelar</button><button class="btn primary" type="submit" form="plan-form">Salvar treino ${icon('check')}</button>`)}
function collectEditor(){if(!editing)return;editing.name=$('[name="plan-name"]').value;editing.letter=$('[name="plan-letter"]').value;editing.days=[...document.querySelectorAll('[name="day"]:checked')].map(x=>+x.value);document.querySelectorAll('[data-edit-ex]').forEach(row=>{const ex=editing.exercises[+row.dataset.editEx];row.querySelectorAll('[data-edit-field]').forEach(input=>ex[input.dataset.editField]=['sets','rest'].includes(input.dataset.editField)?Number(input.value):input.value)})}
function savePlan(){collectEditor();if(!editing.exercises.length){$('#edit-error').textContent='Adicione pelo menos um exercício.';return}if(!editing.name.trim()||!editing.letter.trim()||editing.exercises.some(e=>!e.name.trim()||!e.reps.trim())){$('#edit-error').textContent='Preencha o nome, a identificação e os exercícios.';return}editing.name=editing.name.trim();editing.demo=false;const i=state.plans.findIndex(p=>p.id===editing.id);if(i<0)state.plans.push(editing);else state.plans[i]=editing;save();closeModal();render();toast('Treino salvo. Seu histórico continua preservado.')}
let pendingId=null;
function showHistory(s,finished=false){const t=totals(s);openModal(finished?'Treino concluído. Boa!':esc(s.name),`<div class="row between"><span class="badge soft">${icon('check')}Salvo neste aparelho</span><span class="small muted">${new Date(s.ended).toLocaleDateString('pt-BR')}</span></div>${finished?`<h2 style="margin-top:20px">${esc(s.name)}</h2>`:''}<p class="small muted" style="margin-top:8px">${esc(profile(s.owner).name)}</p><div class="summary-grid"><div><span class="small muted">Tempo de treino</span><div class="summary-value">${duration(s)} <span class="small muted">min</span></div></div><div><span class="small muted">Séries concluídas</span><div class="summary-value">${t.sets}</div></div></div>${s.exercises.map(e=>`<div class="history-ex"><h3>${esc(e.name)}</h3><p>${e.records.filter(r=>r.done).map(r=>`${esc(r.kg)} kg × ${esc(r.reps)}`).join(' &nbsp; · &nbsp; ')||'Nenhuma série concluída'}</p>${e.sessionNotes?`<p>Obs.: ${esc(e.sessionNotes)}</p>`:''}</div>`).join('')}`,`<button class="btn primary" data-action="close-modal">${finished?'Tudo certo':'Fechar'} ${icon('check')}</button>`)}
function finish(){const s=state.ongoing[state.active];if(!totals(s).sets){toast('Conclua pelo menos uma série para salvar o treino.');return}const total=s.exercises.reduce((n,e)=>n+e.records.length,0);if(totals(s).sets<total)confirmModal('Finalizar por hoje?',`Você concluiu ${totals(s).sets} de ${total} séries. As séries feitas serão salvas; as pendentes não contarão no histórico.`,'confirm-finish','Finalizar treino');else completeSession()}
function completeSession(){const s=state.ongoing[state.active];s.ended=Date.now();state.sessions.push(clone(s));delete state.ongoing[state.active];if(state.rest?.owner===state.active)state.rest=null;const saved=save();closeModal();navigate('history');showHistory(s,true);if(!saved){const badge=$('#modal .badge');if(badge)badge.textContent='Não foi possível salvar neste navegador'}}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.nav){navigate(b.dataset.nav);return}if(b.dataset.owner){planOwner=b.dataset.owner;render();return}if(b.dataset.themeChoice){state.theme=b.dataset.themeChoice;save();render();return}if(b.dataset.date){selectedDate=new Date(b.dataset.date+'T12:00:00');selectedPlan=null;render();return}const a=b.dataset.action,id=b.dataset.id,i=+b.dataset.index;if(!a)return;switch(a){case'close-modal':closeModal();break;case'choose':choosePlan();break;case'select-plan':selectedPlan=id;closeModal();navigate('home');break;case'start':startPlan(id);break;case'continue':navigate('session');break;case'new-plan':openEditor();break;case'edit-plan':openEditor(id);break;case'add-exercise':collectEditor();editing.exercises.push(exercise(''));renderEditor();break;case'remove-exercise':collectEditor();editing.exercises.splice(i,1);renderEditor();break;case'move-up':case'move-down':collectEditor();const to=a==='move-up'?i-1:i+1;[editing.exercises[i],editing.exercises[to]]=[editing.exercises[to],editing.exercises[i]];renderEditor();break;case'delete-plan':pendingId=id;confirmModal('Excluir este treino?','O plano será removido. As sessões concluídas e o treino em andamento serão preservados.','confirm-delete','Excluir treino',true);break;case'confirm-delete':state.plans=state.plans.filter(p=>p.id!==pendingId);save();closeModal();render();toast('Treino excluído.');break;case'duplicate':pendingId=id;openModal('Duplicar treino',`<label class="field">Para qual perfil?<select id="duplicate-owner">${state.profiles.map(p=>`<option value="${p.id}" ${p.id===planOwner?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>`,`<button class="btn" data-action="close-modal">Cancelar</button><button class="btn primary" data-action="confirm-duplicate">Duplicar</button>`);break;case'confirm-duplicate':const p=clone(state.plans.find(x=>x.id===pendingId));p.id=uid();p.owner=$('#duplicate-owner').value;p.name+=' (cópia)';p.demo=false;p.exercises.forEach(e=>e.id=uid());state.plans.push(p);planOwner=p.owner;save();closeModal();render();toast('Treino duplicado.');break;case'check-set':checkSet(+b.dataset.ex,+b.dataset.set);break;case'pause-rest':if(state.rest){if(state.rest.paused){state.rest.end=Date.now()+state.rest.remaining;state.rest.paused=false}else{state.rest.remaining=Math.max(0,state.rest.end-Date.now());state.rest.paused=true}save();renderRest()}break;case'extend-rest':if(state.rest){if(state.rest.paused)state.rest.remaining+=30000;else state.rest.end+=30000;save();renderRest()}break;case'skip-rest':state.rest=null;save();renderRest();break;case'finish':finish();break;case'confirm-finish':completeSession();break;case'discard':confirmModal('Descartar esta sessão?','As séries registradas nesta sessão serão removidas. Seu plano e histórico permanecerão.','confirm-discard','Descartar',true);break;case'confirm-discard':delete state.ongoing[state.active];if(state.rest?.owner===state.active)state.rest=null;save();closeModal();navigate('home');break;case'history-detail':showHistory(state.sessions.find(s=>s.id===id));break;case'export':const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='ritmo-dados-'+dateKey(new Date())+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Cópia dos dados exportada.');break;case'reset':confirmModal('Recomeçar a demonstração?','Todos os planos, nomes, sessões e históricos deste navegador serão apagados. Exporte seus dados antes de continuar.','confirm-reset','Apagar e recomeçar',true);break;case'confirm-reset':state=initial();selectedPlan=null;planOwner=state.active;selectedDate=new Date();save();closeModal();navigate('home');toast('Demonstração reiniciada.');break}});
document.addEventListener('input',event=>{const el=event.target;if(el.dataset.field){const s=state.ongoing[state.active];if(!s)return;const r=s.exercises[+el.dataset.ex].records[+el.dataset.set];r[el.dataset.field]=el.value;if(r.done){r.done=false;const row=el.closest('.set-row');row.classList.remove('done');row.querySelector('button').setAttribute('aria-pressed','false');updateProgress()}save()}if(el.dataset.notes!==undefined){const s=state.ongoing[state.active];if(s){s.exercises[+el.dataset.notes].sessionNotes=el.value;save()}}});
document.addEventListener('submit',event=>{if(event.target.id==='plan-form'){event.preventDefault();savePlan()}if(event.target.id==='profiles-form'){event.preventDefault();const form=new FormData(event.target);if(state.profiles.some(p=>!String(form.get(p.id)).trim())){toast('Preencha os nomes dos dois perfis.');return}state.profiles.forEach(p=>p.name=String(form.get(p.id)).trim());save();render();toast('Nomes atualizados.')}});
$('#profile-select').addEventListener('change',event=>{state.active=event.target.value;planOwner=state.active;selectedPlan=null;save();navigate('home');toast('Perfil de '+profile().name)});
$('#theme-toggle').addEventListener('click',()=>{state.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();render()});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.theme==='system')applyTheme()});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const next=JSON.parse(e.newValue);if(next.version===1){state=next;planOwner=state.active;render();toast('Dados atualizados por outra aba.')}}catch{}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)renderRest()});
render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
